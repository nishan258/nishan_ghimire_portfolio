<style>
.slideshow-wrap{margin:2em 0 4em}.slide-stage{display:grid;grid-template-columns:4em minmax(0,1fr) 4em;grid-template-rows:1fr;gap:1.4em;align-items:center;justify-content:center;min-height:62vh;padding:2em 1.5em;background:rgba(0,0,0,.18);border:solid 1px rgba(255,255,255,.12)}
.slide{display:none;grid-column:2;grid-row:1;width:100%;text-align:center}.slide.active{display:block}.slide video{display:block;width:100%;max-width:960px;max-height:68vh;margin:0 auto;background:#000;box-shadow:0 .5em 2em rgba(0,0,0,.28)}
.video-title{margin:1em auto 0;max-width:960px;text-align:left;font-weight:600}
.slide-nav{position:static;transform:none;width:3em;height:3em;min-width:3em;padding:0!important;border:solid 2px #fff!important;border-radius:50%;z-index:2;background:rgba(20,25,45,.75)!important;box-shadow:none!important;justify-self:center;align-self:center;display:flex!important;align-items:center;justify-content:center}
.slide-nav::before{content:""!important;display:block!important;width:.62em;height:.62em;background:transparent!important;border-style:solid;border-color:#fff;box-sizing:border-box}.slide-nav.prev::before{border-width:0 0 3px 3px;transform:rotate(45deg);margin-left:.22em}.slide-nav.next-slide::before{border-width:3px 3px 0 0;transform:rotate(45deg);margin-right:.22em}.slide-nav::after{content:none!important;display:none!important}.slide-nav.prev{grid-column:1;grid-row:1}.slide-nav.next-slide{grid-column:3;grid-row:1}
.slide-controls{display:flex;align-items:center;justify-content:center;gap:1.1em;padding-top:1.2em}.slide-counter{font-size:.9em;letter-spacing:.12em}.dots{display:flex;gap:.55em}.dot{width:.65em;height:.65em;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}.dot.active{background:#fff}
@media screen and (max-width:736px){.slide-stage{grid-template-columns:2.7em minmax(0,1fr) 2.7em;gap:.55em;min-height:45vh;padding:1em .45em}.slide-nav{width:2.5em;height:2.5em;min-width:2.5em}.video-title{text-align:center}}
</style>
</head>

<div class="slideshow-wrap" aria-label="Video slideshow"><div class="slide-stage"><button class="slide-nav prev" type="button" aria-label="Previous video"></button>

<script src="assets/js/jquery.min.js"></script><script src="assets/js/jquery.scrolly.min.js"></script><script src="assets/js/jquery.scrollex.min.js"></script><script src="assets/js/browser.min.js"></script><script src="assets/js/breakpoints.min.js"></script><script src="assets/js/util.js"></script><script src="assets/js/main.js"></script>
<script>(function(){var slides=[].slice.call(document.querySelectorAll('.slide')),dots=[].slice.call(document.querySelectorAll('.dot')),counter=document.querySelector('.slide-counter'),current=0;function show(i){slides[current].querySelector('video').pause();current=(i+slides.length)%slides.length;slides.forEach(function(s,j){s.classList.toggle('active',j===current)});dots.forEach(function(d,j){d.classList.toggle('active',j===current)});counter.textContent=(current+1)+' / '+slides.length}document.querySelector('.prev').onclick=function(){show(current-1)};document.querySelector('.next-slide').onclick=function(){show(current+1)};dots.forEach(function(d){d.onclick=function(){show(parseInt(d.dataset.slide,10))}});document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)})})();</script>
