<html>
	<head>
		<title>Portfolio | Nishan Ghimire</title>
		<!-- v12 horizontal portfolio layout -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<style>
			#portfolio-list { padding: 2.5em 0 5em 0; }
			.portfolio-row {
				display: grid;
				grid-template-columns: 20em minmax(0, 1fr);
				gap: 2.5em;
				align-items: center;
				padding: 2em 0;
				border-bottom: solid 1px rgba(212, 212, 255, 0.12);
			}
			.portfolio-row:first-child { padding-top: 0; }
			.portfolio-row:last-child { border-bottom: 0; }
			.portfolio-preview {
				display: block;
				width: 100%;
				aspect-ratio: 1 / 1;
				overflow: hidden;
				border-radius: 4px;
				background: #1f243d;
				margin: 0;
			}
			.portfolio-preview img,
			.portfolio-preview video {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			.portfolio-copy { align-self: center; }
			.portfolio-label {
				font-size: 0.75em;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				opacity: 0.62;
				margin: 0 0 1.1em 0;
			}
			.portfolio-copy h2 {
				font-size: 1.65em;
				margin: 0 0 1.15em 0;
			}
			.portfolio-copy .button { margin: 0; }
			@media screen and (max-width: 980px) {
				.portfolio-row { grid-template-columns: 15em minmax(0, 1fr); gap: 2em; }
			}
			@media screen and (max-width: 736px) {
				#portfolio-list { padding-top: 1.5em; }
				.portfolio-row { grid-template-columns: 1fr; gap: 1.4em; padding: 2em 0; }
				.portfolio-preview { max-width: 100%; aspect-ratio: 4 / 3; }
			}
		</style>
	</head>
	<body class="is-preload">

		<div id="wrapper">

			<header id="header" class="alt style2">
				<a href="index.html" class="logo"><strong>Nishan Ghimire</strong></a>
				<nav><a href="#menu">Menu</a></nav>
			</header>

			<nav id="menu">
				<ul class="links">
					<li><a href="portfolio.html">Portfolio</a></li>
					<li><a href="resume.html">Resume</a></li>
				</ul>
			</nav>

			<section id="banner" class="style2">
				<div class="inner">
					<span class="image"><img src="images/pic07.jpg" alt="" /></span>
					<header class="major"><h1>Portfolio</h1></header>
				</div>
			</section>

			<div id="main">
				<section id="portfolio-list">
					<div class="inner">

						<article class="portfolio-row">
							<a class="portfolio-preview" href="images-gallery.html" aria-label="Open image gallery">
								<img src="gran-turismo.png" alt="Preview of image collection" />
							</a>
							<div class="portfolio-copy">
								<p class="portfolio-label">Visual Work</p>
								<h2>Collection of Images</h2>
								<a href="images-gallery.html" class="button small">View Gallery</a>
							</div>
						</article>

						<article class="portfolio-row">
							<a class="portfolio-preview" href="videos-gallery.html" aria-label="Open video gallery">
								<video id="portfolio-video" muted playsinline preload="metadata">
									<source src="qbd-approach.mp4" type="video/mp4" />
									Your browser does not support the video tag.
								</video>
							</a>
							<div class="portfolio-copy">
								<p class="portfolio-label">Video Work</p>
								<h2>Collection of Videos</h2>
								<a href="videos-gallery.html" class="button small">View Gallery</a>
							</div>
						</article>

						<article class="portfolio-row">
							<a class="portfolio-preview" href="writing-gallery.html" aria-label="Open writing collection">
								<img src="images/pic10.jpg" alt="Preview of writing collection" />
							</a>
							<div class="portfolio-copy">
								<p class="portfolio-label">Writing</p>
								<h2>Collection of Writing</h2>
								<a href="writing-gallery.html" class="button small">View Writing</a>
							</div>
						</article>

					</div>
				</section>
			</div>

		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

	</body>
</html>
