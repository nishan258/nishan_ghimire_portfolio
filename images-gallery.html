<html>
	<head>
		<title>Image Gallery | Nishan Ghimire</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<style>
			.slideshow-wrap {
				max-width: 1180px;
				margin: 1.5em auto 0;
			}
			.slide-stage {
				display: grid;
				grid-template-columns: 3.75em minmax(0, 900px) 3.75em;
				grid-template-rows: 1fr;
				gap: 1.4em;
				align-items: center;
				justify-content: center;
				min-height: 62vh;
				padding: 2em 1.5em;
				background: rgba(0, 0, 0, 0.18);
				border: solid 1px rgba(255, 255, 255, 0.12);
			}
			.slide {
				display: none;
				grid-column: 2;
				grid-row: 1;
				width: 100%;
				text-align: center;
			}
			.slide.active { display: block; }
			.slide a { border: 0; }
			.slide img {
				display: block;
				max-width: 100%;
				max-height: 68vh;
				width: auto;
				height: auto;
				margin: 0 auto;
				object-fit: contain;
				box-shadow: 0 0.5em 2em rgba(0, 0, 0, 0.28);
			}
			.slide-nav {
				position: static;
				transform: none;
				width: 3.1em;
				height: 3.1em;
				padding: 0;
				border-radius: 100%;
				font-size: 1.2em;
				line-height: 3em;
				text-align: center;
				z-index: 2;
				background: rgba(20, 25, 45, 0.75);
				justify-self: center;
				align-self: center;
			}
			.slide-nav.prev { grid-column: 1; grid-row: 1; }
			.slide-nav.next { grid-column: 3; grid-row: 1; }
			.slide-controls {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 1.1em;
				padding-top: 1.2em;
			}
			.slide-counter {
				font-size: 0.9em;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			.dots {
				display: flex;
				gap: 0.55em;
			}
			.dot {
				width: 0.65em;
				height: 0.65em;
				border-radius: 50%;
				background: rgba(255,255,255,0.3);
				cursor: pointer;
			}
			.dot.active { background: #ffffff; }
			@media screen and (max-width: 736px) {
				.slide-stage {
					grid-template-columns: 2.7em minmax(0, 1fr) 2.7em;
					gap: 0.55em;
					min-height: 50vh;
					padding: 1em 0.45em;
				}
				.slide img { max-height: 58vh; }
				.slide-nav {
					width: 2.35em;
					height: 2.35em;
					font-size: 1em;
					line-height: 2.2em;
				}
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<header id="header">
				<a href="index.html" class="logo"><strong>Nishan Ghimire</strong></a>
				<nav><a href="#menu">Menu</a></nav>
			</header>

			<nav id="menu">
				<ul class="links">
					<li><a href="portfolio.html">Portfolio</a></li>
					<li><a href="resume.html">Resume</a></li>
				</ul>
			</nav>

			<div id="main" class="alt">
				<section id="one">
					<div class="inner">
						<header class="major">
							<h1>Collection of Images</h1>
						</header>

						<div class="slideshow-wrap" aria-label="Image slideshow">
							<div class="slide-stage">
								<button class="slide-nav prev" type="button" aria-label="Previous image">&#10094;</button>

								<div class="slide active">
									<a href="gran-turismo.png" target="_blank" rel="noopener">
										<img src="gran-turismo.png" alt="Sony AI Gran Turismo visual" />
									</a>
								</div>
								<div class="slide">
									<a href="azure-xamarin.png" target="_blank" rel="noopener">
										<img src="azure-xamarin.png" alt="Azure Xamarin visual" />
									</a>
								</div>
								<div class="slide">
									<a href="ai-hydropower.png" target="_blank" rel="noopener">
										<img src="ai-hydropower.png" alt="AI hydropower visual" />
									</a>
								</div>

								<button class="slide-nav next" type="button" aria-label="Next image">&#10095;</button>
							</div>

							<div class="slide-controls">
								<span class="slide-counter" aria-live="polite">1 / 3</span>
								<div class="dots" aria-label="Choose image">
									<span class="dot active" data-slide="0" role="button" tabindex="0" aria-label="Show image 1"></span>
									<span class="dot" data-slide="1" role="button" tabindex="0" aria-label="Show image 2"></span>
									<span class="dot" data-slide="2" role="button" tabindex="0" aria-label="Show image 3"></span>
								</div>
							</div>
						</div>
					</div>
				</section>
			</div>
		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
		<script>
			(function () {
				var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
				var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
				var counter = document.querySelector('.slide-counter');
				var current = 0;

				function showSlide(index) {
					current = (index + slides.length) % slides.length;
					slides.forEach(function (slide, i) {
						slide.classList.toggle('active', i === current);
					});
					dots.forEach(function (dot, i) {
						dot.classList.toggle('active', i === current);
					});
					counter.textContent = (current + 1) + ' / ' + slides.length;
				}

				document.querySelector('.prev').addEventListener('click', function () { showSlide(current - 1); });
				document.querySelector('.next').addEventListener('click', function () { showSlide(current + 1); });

				dots.forEach(function (dot) {
					dot.addEventListener('click', function () { showSlide(parseInt(dot.getAttribute('data-slide'), 10)); });
					dot.addEventListener('keydown', function (event) {
						if (event.key === 'Enter' || event.key === ' ') {
							event.preventDefault();
							showSlide(parseInt(dot.getAttribute('data-slide'), 10));
						}
					});
				});

				document.addEventListener('keydown', function (event) {
					if (event.key === 'ArrowLeft') showSlide(current - 1);
					if (event.key === 'ArrowRight') showSlide(current + 1);
				});
			})();
		</script>
	</body>
</html>
